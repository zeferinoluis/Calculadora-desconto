<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Desconto</title>
  <meta name="description" content="Calculadora para calcular a percentagem do desconto para obter o valor promocional com 4 casas decimais." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px;
    }

    header {
      width: 100%;
      max-width: 440px;
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #0f172a;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      color: #0f172a;
      line-height: 1.3;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 500;
      color: #475569;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: #0284c7;
      font-size: 17px;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    .final-icon {
      color: #4f46e5;
    }

    .input-field {
      width: 100%;
      height: 52px;
      padding: 0 42px 0 38px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 16px;
      color: #0f172a;
      background: #ffffff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
    }

    .btn-clear-field {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .btn-clear-field:hover {
      color: #475569;
      background-color: #f1f5f9;
    }

    .btn-clear-all {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      background: transparent;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      color: #334155;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-clear-all:hover {
      background: #f8fafc;
      border-color: #94a3b8;
    }

    .btn-clear-all svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Bloco de Resultado */
    .result-card {
      border-radius: 14px;
      padding: 24px 16px;
      color: #ffffff;
      text-align: center;
      transition: background 0.3s ease;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .result-card.increase {
      background: linear-gradient(135deg, #fb7185, #4f46e5);
    }

    .result-card.invalid {
      background: linear-gradient(135deg, #334155, #1e293b);
    }

    .result-percent {
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .result-description {
      font-size: 14px;
      line-height: 1.4;
      opacity: 0.95;
    }

    .footer-note {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>Calculadora de Desconto</h1>
  </header>

  <main class="card">
    <h2 class="card-title">Calculadora de Percentagem de Desconto</h2>

    <!-- Campo 1 -->
    <div class="form-group">
      <label for="originalPrice">Valor original / tratamento (€)</label>
      <div class="input-wrapper">
        <span class="input-icon">€</span>
        <input
          type="text"
          id="originalPrice"
          class="input-field"
          inputmode="decimal"
          placeholder="Ex: 60"
          value="60"
        />
        <button type="button" class="btn-clear-field" id="clearOrigBtn" aria-label="Limpar valor original">&times;</button>
      </div>
    </div>

    <!-- Campo 2 -->
    <div class="form-group">
      <label for="finalPrice">Valor final pretendido / a cobrar (€)</label>
      <div class="input-wrapper">
        <span class="input-icon final-icon">€</span>
        <input
          type="text"
          id="finalPrice"
          class="input-field"
          inputmode="decimal"
          placeholder="Ex: 38"
          value="38"
        />
        <button type="button" class="btn-clear-field" id="clearFinalBtn" aria-label="Limpar valor final">&times;</button>
      </div>
    </div>

    <!-- Botão Limpar Tudo -->
    <button type="button" class="btn-clear-all" id="clearAllBtn">
      <svg viewBox="0 0 24 24">
        <path d="M15 16h4v2h-4zm0-8h7v2h-7zm0 4h6v2h-6zM3 18c0 1.1.9 2 2 2h6c1.1 0 2-.9 2-2V8H3v10zm2-8h6v8H5v-8zm5-6H6L5 5H2v2h12V5h-3z"/>
      </svg>
      Limpar Campos
    </button>

    <!-- Bloco de Resultado -->
    <div class="result-card" id="resultCard">
      <div class="result-percent" id="resultPercent">36,6667%</div>
      <div class="result-description" id="resultDescription">
        de desconto sobre 60,0000 € (poupança de 22,0000 €)
      </div>
    </div>

    <!-- Nota Informativa -->
    <p class="footer-note">
      A percentagem indica quanto deve ser descontado ao valor original para obter o valor final.
    </p>
  </main>

  <script>
    const origInput = document.getElementById('originalPrice');
    const finalInput = document.getElementById('finalPrice');
    const clearOrigBtn = document.getElementById('clearOrigBtn');
    const clearFinalBtn = document.getElementById('clearFinalBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const resultCard = document.getElementById('resultCard');
    const resultPercent = document.getElementById('resultPercent');
    const resultDesc = document.getElementById('resultDescription');

    function formatNumberPt(val, decimals = 4) {
      const parts = Number(val).toFixed(decimals).split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      return parts.join(',');
    }

    function formatCurrency(val) {
      return formatNumberPt(val, 4) + ' €';
    }

    function formatPercent(val) {
      return formatNumberPt(val, 4) + '%';
    }

    function sanitize(val) {
      let cleaned = val.replace(',', '.').replace(/[^0-9.]/g, '');
      const firstDot = cleaned.indexOf('.');
      if (firstDot !== -1) {
        cleaned = cleaned.substring(0, firstDot + 1) + cleaned.substring(firstDot + 1).replace(/\./g, '');
      }
      return cleaned;
    }

    function calculate() {
      const origRaw = sanitize(origInput.value);
      const finalRaw = sanitize(finalInput.value);

      clearOrigBtn.style.display = origInput.value.length > 0 ? 'inline-flex' : 'none';
      clearFinalBtn.style.display = finalInput.value.length > 0 ? 'inline-flex' : 'none';

      const orig = parseFloat(origRaw);
      const finalVal = parseFloat(finalRaw);

      if (isNaN(orig) || isNaN(finalVal) || orig <= 0) {
        resultCard.className = 'result-card invalid';
        resultPercent.textContent = '0,0000%';
        resultDesc.textContent = 'Insira os dois valores';
        return;
      }

      const discountAmount = orig - finalVal;
      const discountPct = ((orig - finalVal) / orig) * 100.0;
      const isIncrease = finalVal > orig;

      if (isIncrease) {
        resultCard.className = 'result-card increase';
        resultPercent.textContent = formatPercent(Math.abs(discountPct));
        resultDesc.textContent = `O valor final é superior ao original (aumento de ${formatPercent(Math.abs(discountPct))})`;
      } else {
        resultCard.className = 'result-card';
        resultPercent.textContent = formatPercent(Math.abs(discountPct));
        resultDesc.textContent = `de desconto sobre ${formatCurrency(orig)} (poupança de ${formatCurrency(discountAmount)})`;
      }
    }

    origInput.addEventListener('input', () => {
      origInput.value = origInput.value.replace(/[^0-9.,]/g, '');
      calculate();
    });

    finalInput.addEventListener('input', () => {
      finalInput.value = finalInput.value.replace(/[^0-9.,]/g, '');
      calculate();
    });

    clearOrigBtn.addEventListener('click', () => {
      origInput.value = '';
      origInput.focus();
      calculate();
    });

    clearFinalBtn.addEventListener('click', () => {
      finalInput.value = '';
      finalInput.focus();
      calculate();
    });

    clearAllBtn.addEventListener('click', () => {
      origInput.value = '';
      finalInput.value = '';
      origInput.focus();
      calculate();
    });

    // Iniciar cálculo
    calculate();
  </script>
</body>
</html>
